<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken + Pig</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f4;
    padding: 20px;
  }
  .topbar {
    max-width: 500px;
    margin: 0 auto 16px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .who {
    font-size: 14px;
    color: #444;
  }
  .who strong { color: #2b2b2b; }
  .signout {
    font-size: 13px;
    color: #c0392b;
    background: none;
    border: none;
    text-decoration: underline;
  }
  h1 {
    text-align: center;
    color: #2b2b2b;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .date {
    text-align: center;
    color: #666;
    margin-bottom: 24px;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 500px;
    margin: 0 auto;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
    color: #2b2b2b;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  #loading {
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 16px;
  }
  #app-content { display: none; }
</style>
</head>
<body>

<div id="loading">Loading...</div>

<div id="app-content">
  <div class="topbar">
    <div class="who">Signed in as <strong id="who-name">...</strong> (<span id="who-role">...</span>)</div>
    <button class="signout" id="signout-btn">Sign Out</button>
  </div>

  <h1>Chicken + Pig</h1>
  <div class="date" id="today-date"></div>

  <div class="grid">
    <div class="card">TODAY</div>
    <a class="card" href="parsheets.html">PAR SHEETS</a>
    <div class="card">PREP</div>
    <div class="card">INVENTORY</div>
    <div class="card">RECIPES</div>
    <div class="card">OPENING</div>
    <div class="card">CLOSING</div>
    <div class="card">TEMP LOGS</div>
    <div class="card">WASTE</div>
    <div class="card">MANAGER LOG</div>
    <div class="card">TEAM</div>
    <div class="card">ADMIN</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjbBgBS59BVcgw5abOl7MT0ZT0PGO2VuQ",
    authDomain: "chicken-and-pig.firebaseapp.com",
    projectId: "chicken-and-pig",
    storageBucket: "chicken-and-pig.firebasestorage.app",
    messagingSenderId: "114769973885",
    appId: "1:114769973885:web:cd3c5f42cd1afd879b1714"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    const userDocRef = doc(db, "users", user.uid);
    const userDocSnap = await getDoc(userDocRef);

    if (!userDocSnap.exists()) {
      document.getElementById('loading').textContent = "Your account exists but has no profile. Ask an admin to set you up.";
      return;
    }

    const userData = userDocSnap.data();
    document.getElementById('who-name').textContent = userData.name || user.email;
    document.getElementById('who-role').textContent = userData.role || "unknown";

    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, options);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app-content').style.display = 'block';
  });

  document.getElementById('signout-btn').addEventListener('click', () => {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  });
</script>

</body>
</html>
