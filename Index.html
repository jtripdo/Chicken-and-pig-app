<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken + Pig</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f4f4;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #2b2b2b;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .date {
    text-align: center;
    color: #666;
    margin-bottom: 24px;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    max-width: 500px;
    margin: 0 auto;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
    color: #2b2b2b;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<h1>Chicken + Pig</h1>
<div class="date" id="today-date"></div>

<div class="grid">
  <div class="card">TODAY</div>
  <div class="card">PAR SHEETS</div>
  <div class="card">PREP</div>
  <div class="card">INVENTORY</div>
  <div class="card">RECIPES</div>
  <div class="card">OPENING</div>
  <div class="card">CLOSING</div>
  <div class="card">TEMP LOGS</div>
  <div class="card">WASTE</div>
  <div class="card">MANAGER LOG</div>
  <div class="card">TEAM</div>
  <div class="card">ADMIN</div>
</div>

<script>
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, options);
</script>

</body>
</html>
